name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  l2-contract:
    name: NET0 native L2 contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: clippy,rust-src,rustfmt
      - run: cargo fmt --all -- --check
      - run: >-
          cargo test --locked --no-default-features --features standard-l2 netif
      - name: Verify native disconnect receipt interleavings
        run: >-
          cargo test --locked --lib --no-default-features
          --features wpa2-personal,smoltcp,incremental-backend-experiment,incremental-embassy-wait,standard-l2
          upstream_supplicant::deauth
      - name: Verify native link-event admission closure
        run: >-
          cargo test --locked --lib --no-default-features
          --features wpa2-personal,smoltcp,incremental-backend-experiment,incremental-embassy-wait,standard-l2
          upstream_supplicant::tests::net0_
      - name: Lint the native NET0 lifecycle integration
        run: >-
          cargo clippy --locked --lib --no-default-features
          --features wpa2-personal,smoltcp,incremental-backend-experiment,incremental-embassy-wait,standard-l2
          -- -D warnings
      - run: cargo clippy --locked --lib --no-default-features --features standard-l2 -- -D warnings
      - name: Verify the one-shot initial-session experiment (not reconnect)
        run: >-
          cargo test --locked --lib --no-default-features
          --features wpa2-personal,standard-l2-initial-session-experiment
      - name: Lint the one-shot initial-session experiment
        run: >-
          cargo clippy --locked --lib --no-default-features
          --features wpa2-personal,standard-l2-initial-session-experiment -- -D warnings
      - run: cargo check '-Zbuild-std=core,alloc' --locked --target riscv32imfc-unknown-none-elf --lib --no-default-features --features standard-l2

  l2-miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: rust-src,miri
      - run: >-
          cargo miri test --locked --no-default-features --features standard-l2 --lib netif
      - name: Interpret native disconnect receipt ownership
        run: >-
          cargo miri test --locked --lib --no-default-features
          --features wpa2-personal,smoltcp,incremental-backend-experiment,incremental-embassy-wait,standard-l2
          upstream_supplicant::deauth
      - name: Interpret native link-event admission closure
        run: >-
          cargo miri test --locked --lib --no-default-features
          --features wpa2-personal,smoltcp,incremental-backend-experiment,incremental-embassy-wait,standard-l2
          upstream_supplicant::tests::net0_

  feature-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
      - name: Reject a missing station security profile cleanly
        run: |
          log="${RUNNER_TEMP}/missing-profile.log"
          if cargo check --locked --features incremental-backend-experiment 2>"${log}"; then
            echo "backend unexpectedly accepted an incremental STA without a security profile" >&2
            exit 1
          fi
          grep -F 'select exactly one WS63 station profile' "${log}"
          ! grep -E 'E0428|E0432|E0433|SelectedProfile' "${log}"
      - name: Reject conflicting station security profiles cleanly
        run: |
          log="${RUNNER_TEMP}/conflicting-profile.log"
          if cargo check --locked --features wpa2-personal,wpa3-personal,incremental-backend-experiment 2>"${log}"; then
            echo "backend unexpectedly accepted conflicting station profiles" >&2
            exit 1
          fi
          grep -F 'select exactly one WS63 Personal profile' "${log}"
          ! grep -E 'E0428|E0432|E0433|SelectedProfile' "${log}"
      - name: Reject direct Wi-Fi/BGLE feature mixing without a named profile
        run: |
          log="${RUNNER_TEMP}/ble-wifi-coexistence.log"
          if cargo check --locked --target x86_64-unknown-linux-gnu --features ble-init,wpa2-personal 2>"${log}"; then
            echo "backend unexpectedly accepted an unnamed BLE/Wi-Fi composition" >&2
            exit 1
          fi
          grep -F 'direct Wi-Fi/BGLE feature mixing is unsupported' "${log}"

  api-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
      - uses: astral-sh/setup-uv@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - name: Check WPA2 public API snapshot and hidden implementation types
        run: uv run --script .github/scripts/check-public-api.py --target x86_64-unknown-linux-gnu --profile wpa2
      - name: Check WPA3 public API snapshot and hidden implementation types
        run: uv run --script .github/scripts/check-public-api.py --target x86_64-unknown-linux-gnu --profile wpa3
      - name: Freeze the internal BLE B3 migration surface
        run: uv run --script .github/scripts/check-public-api.py --target x86_64-unknown-linux-gnu --profile ble-b3
      - name: Compile the internal BLE B3 migration contract
        run: cargo test --locked --target x86_64-unknown-linux-gnu --test radio_stage_contract --features ble-init
      - name: Freeze the internal SLE S3 migration surface
        run: uv run --script .github/scripts/check-public-api.py --target x86_64-unknown-linux-gnu --profile sle-s3
      - name: Compile the internal SLE S3 migration contract
        run: cargo test --locked --target x86_64-unknown-linux-gnu --test radio_stage_contract --features sle-init

  profile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: wpa2-net0-storage-contract
            features: wpa2-personal,smoltcp,incremental-backend-experiment,incremental-embassy-wait,standard-l2
          - profile: wpa2-smoltcp
            features: wpa2-personal,smoltcp,incremental-backend-experiment,incremental-embassy-wait
          - profile: wpa3-smoltcp
            features: wpa3-personal,smoltcp,incremental-backend-experiment,incremental-embassy-wait
          - profile: wpa2-incremental
            features: wpa2-personal,incremental-backend-experiment
          - profile: wpa3-incremental
            features: wpa3-personal,incremental-backend-experiment
          - profile: wpa2-legacy-oracle
            features: wpa2-personal,smoltcp,legacy-blocking-backend
          - profile: wpa2-ble-coexistence
            features: wpa2-personal,coexistence-wifi-ble,incremental-embassy-wait
          - profile: wpa2-sle-connected
            features: wpa2-personal,coexistence-wifi-sle,incremental-embassy-wait
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: clippy,rust-src,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --lib --features ${{ matrix.features }}
      - run: cargo check --locked --lib --features ${{ matrix.features }}
      - run: cargo clippy --locked --lib --features ${{ matrix.features }} -- -D warnings
      - name: Lint NET0 regression tests as well as the library
        if: matrix.profile == 'wpa2-net0-storage-contract'
        run: cargo clippy --locked --lib --tests --features ${{ matrix.features }} -- -D warnings
      - run: cargo check -Zbuild-std=core,alloc --locked --target riscv32imfc-unknown-none-elf --lib --features ${{ matrix.features }}
      - name: Emit the versioned profile resource report
        run: cargo run --locked --example resource_report --features ${{ matrix.features }} > resource-report.json
      - name: Show the profile resource report
        run: cat resource-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: resource-report-${{ matrix.profile }}
          path: resource-report.json
          if-no-files-found: error

  softap-profile:
    name: SoftAP profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: wpa2
            features: upstream-authenticator-wpa2
          - profile: wpa3
            features: upstream-authenticator-wpa3
          - profile: wpa2-sle-coexistence
            features: upstream-authenticator-wpa2,coexistence-wifi-sle
          - profile: wpa2-ble-coexistence
            features: upstream-authenticator-wpa2,coexistence-wifi-ble
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: clippy,rust-src,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --lib --features ${{ matrix.features }}
      - run: cargo clippy --locked --lib --features ${{ matrix.features }} -- -D warnings
      - run: cargo check -Zbuild-std=core,alloc --locked --target riscv32imfc-unknown-none-elf --lib --features ${{ matrix.features }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
      - name: Verify the committed standalone lockfile
        run: |
          git ls-files --error-unmatch Cargo.lock
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - run: cargo package --locked

  minimal-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: rust-src
      - name: Check the feature-minimal WS63 target graph
        run: cargo check -Zbuild-std=core,alloc --locked --target riscv32imfc-unknown-none-elf --lib

  final-link:
    name: Final RF link (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: rust-src
      - name: Link the explicit legacy WPA2 migration oracle with stock rust-lld
        run: cargo build -Zbuild-std=core --locked --release --target riscv32imfc-unknown-none-elf --example plain_firmware --features wpa2-personal,smoltcp,legacy-blocking-backend
      - name: Link the no-AP bootstrap profiler with stock rust-lld
        run: cargo build -Zbuild-std=core --locked --release --target riscv32imfc-unknown-none-elf --example bootstrap_profile --features wpa2-personal,incremental-backend-experiment,bootstrap-stage-diag,firmware-example
      - name: Link NET0 caller-owned storage without reducing the existing arena or stacks
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example bootstrap_profile --features wpa2-personal,smoltcp,incremental-backend-experiment,incremental-embassy-wait,standard-l2,bootstrap-stage-diag,firmware-example
      - uses: astral-sh/setup-uv@v7
      - name: Verify NET0 target storage and negative report fixtures
        run: uv run --script .github/scripts/check-net0-storage.py target/riscv32imfc-unknown-none-elf/release/examples/bootstrap_profile --self-test --output net0-storage.json
      - uses: actions/upload-artifact@v4
        with:
          name: net0-linked-storage-${{ matrix.os }}
          path: net0-storage.json
          if-no-files-found: error
      - name: Link the credential-free arena admission error fixture
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example arena_admission_error --features wpa2-personal,smoltcp,firmware-example
      - name: Link the credential-free typed-error parity fixture
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example typed_error_parity --features wpa2-personal,smoltcp,firmware-example
      - name: Link the credential-free operation-error injection fixture
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example operation_error_injection --features wpa2-personal,incremental-backend-experiment,firmware-example
      - name: Link the credential-free connectivity contract fixture
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example connectivity_contract_fixture --features firmware-example
      - name: Link the credential-free BLE B1 controller closure with stock rust-lld
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example ble_init_link --no-default-features --features ble-init,firmware-example
      - name: Link the credential-free incremental scan profiler with stock rust-lld
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example incremental_scan_profile --features wpa2-personal,incremental-backend-experiment,incremental-embassy-wait,bootstrap-stage-diag,firmware-example
      - name: Link NET0 profile-owned device and worker with admission closed
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example incremental_scan_profile --features wpa2-personal,smoltcp,incremental-backend-experiment,incremental-embassy-wait,standard-l2,bootstrap-stage-diag,firmware-example
      - name: Verify physical storage in the closed-route incremental fixture
        run: uv run --script .github/scripts/check-net0-storage.py target/riscv32imfc-unknown-none-elf/release/examples/incremental_scan_profile --self-test --output net0-incremental-storage.json
      - name: Link the one-shot NET0 payload experiment (not a reconnect profile)
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example incremental_scan_profile --features wpa2-personal,standard-l2-initial-session-experiment,incremental-connect-profile,bootstrap-stage-diag,firmware-example
      - name: Verify physical storage in the actual NET0 payload fixture
        run: uv run --script .github/scripts/check-net0-storage.py target/riscv32imfc-unknown-none-elf/release/examples/incremental_scan_profile --self-test --output net0-payload-storage.json
      - name: Verify actual native cleanup calls and missing-call negative fixtures
        run: uv run --script .github/scripts/check-net0-cleanup.py --elf target/riscv32imfc-unknown-none-elf/release/examples/incremental_scan_profile --test --tamper-test --output net0-cleanup-link.json
      - uses: actions/upload-artifact@v4
        with:
          name: net0-incremental-linked-storage-${{ matrix.os }}
          path: |
            net0-incremental-storage.json
            net0-payload-storage.json
            net0-cleanup-link.json
          if-no-files-found: error
      - name: Link the credential-free incremental cancellation profiler with stock rust-lld
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example incremental_scan_profile --features wpa2-personal,incremental-backend-experiment,incremental-embassy-wait,incremental-cancel-profile,bootstrap-stage-diag,firmware-example
      - name: Link the redacted WPA3 incremental connect profiler with stock rust-lld
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example incremental_scan_profile --features wpa3-personal,incremental-backend-experiment,incremental-embassy-wait,incremental-connect-profile,bootstrap-stage-diag,firmware-example
      - name: Link the credential-free Wi-Fi plus BLE shared-resource composition
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example wifi_ble_coexistence_smoke --features wpa2-personal,firmware-example,coexistence-wifi-ble,incremental-embassy-wait
      - name: Link the credential-free Wi-Fi plus connected BLE composition
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example wifi_ble_connected_client_smoke --features wpa2-personal,firmware-example,coexistence-wifi-ble,incremental-embassy-wait
      - name: Link the credential-free Wi-Fi plus SLE shared-resource composition
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example wifi_sle_coexistence_smoke --features wpa2-personal,firmware-example,coexistence-wifi-sle,incremental-embassy-wait
      - name: Link the credential-free Wi-Fi plus connected SLE composition
        run: cargo build '-Zbuild-std=core,alloc' --locked --release --target riscv32imfc-unknown-none-elf --example wifi_sle_connected_client_smoke --features wpa2-personal,firmware-example,coexistence-wifi-sle,incremental-embassy-wait
